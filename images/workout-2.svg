<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2028"/>
      <stop offset="100%" stop-color="#1e1820"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#fff5e0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff5e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4956a"/>
      <stop offset="100%" stop-color="#c07a52"/>
    </linearGradient>
    <linearGradient id="outfit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg2)"/>
  <rect width="400" height="300" fill="url(#spotlight)"/>

  <!-- 床 -->
  <rect x="0" y="260" width="400" height="40" fill="#1a1520" opacity="0.8"/>
  <line x1="0" y1="262" x2="400" y2="262" stroke="#333" stroke-width="1"/>

  <!-- === 女性シルエット（後ろ向き・両手ダンベル上げ） === -->
  <!-- 脚 -->
  <rect x="175" y="215" width="20" height="52" rx="10" fill="url(#outfit)"/>
  <rect x="200" y="215" width="20" height="52" rx="10" fill="url(#outfit)"/>

  <!-- レギンスのハイライト -->
  <rect x="178" y="215" width="5" height="50" rx="2" fill="#3a3a3a" opacity="0.5"/>
  <rect x="203" y="215" width="5" height="50" rx="2" fill="#3a3a3a" opacity="0.5"/>

  <!-- スポーツブラ背面 -->
  <path d="M168 130 Q195 122 227 130 L224 210 Q195 215 171 210 Z" fill="url(#outfit)"/>

  <!-- クロスバックストラップ -->
  <path d="M178 132 L212 155" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <path d="M218 132 L183 155" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <line x1="172" y1="132" x2="192" y2="135" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <line x1="223" y1="132" x2="203" y2="135" stroke="#444" stroke-width="4" stroke-linecap="round"/>

  <!-- 背中の筋肉ライン -->
  <path d="M192 135 Q195 170 193 208" stroke="#333" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M198 135 Q195 170 197 208" stroke="#333" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- 背中の肌（肩甲骨あたり） -->
  <path d="M178 132 Q170 145 172 158 Q180 165 195 162 Q210 165 220 158 Q222 145 217 132" fill="url(#skin)" opacity="0.3"/>

  <!-- 首・後頭部 -->
  <rect x="189" y="108" width="18" height="28" rx="9" fill="url(#skin)"/>

  <!-- 髪（ポニーテール） -->
  <ellipse cx="198" cy="100" rx="22" ry="20" fill="#3a2a1a"/>
  <path d="M208 95 Q225 85 230 70 Q235 55 225 48 Q215 45 210 55 Q205 65 208 78" fill="#3a2a1a"/>
  <path d="M208 95 Q226 86 231 71" stroke="#2a1a0a" stroke-width="3" fill="none"/>

  <!-- 左腕（肘曲げてダンベル上げ） -->
  <path d="M171 145 Q148 142 138 125 Q132 112 140 105" stroke="url(#skin)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- 左前腕 -->
  <path d="M140 105 Q136 95 132 85" stroke="url(#skin)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- 左ダンベル -->
  <g transform="translate(118,70) rotate(-30)">
    <rect x="0" y="4" width="60" height="8" rx="4" fill="#888"/>
    <rect x="-8" y="0" width="10" height="16" rx="3" fill="#666"/>
    <rect x="58" y="0" width="10" height="16" rx="3" fill="#666"/>
    <rect x="1" y="5" width="58" height="3" rx="1" fill="#aaa" opacity="0.4"/>
  </g>

  <!-- 右腕（肘曲げてダンベル上げ） -->
  <path d="M224 145 Q247 142 257 125 Q263 112 255 105" stroke="url(#skin)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- 右前腕 -->
  <path d="M255 105 Q259 95 263 85" stroke="url(#skin)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- 右ダンベル -->
  <g transform="translate(248,64) rotate(30)">
    <rect x="0" y="4" width="60" height="8" rx="4" fill="#888"/>
    <rect x="-8" y="0" width="10" height="16" rx="3" fill="#666"/>
    <rect x="58" y="0" width="10" height="16" rx="3" fill="#666"/>
    <rect x="1" y="5" width="58" height="3" rx="1" fill="#aaa" opacity="0.4"/>
  </g>

  <!-- 足元の影 -->
  <ellipse cx="197" cy="264" rx="35" ry="5" fill="#000" opacity="0.4"/>

  <!-- ピンクのアクセントライン -->
  <rect x="0" y="295" width="400" height="5" fill="#FF1E8E" opacity="0.6"/>

  <!-- テキスト -->
  <text x="20" y="285" font-family="sans-serif" font-size="11" fill="#ffffff" opacity="0.35" letter-spacing="3">STRENGTH</text>
</svg>

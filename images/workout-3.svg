<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c24"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="floor3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#1e1e26"/>
    </linearGradient>
    <radialGradient id="sp3" cx="35%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8845a"/>
      <stop offset="100%" stop-color="#b06840"/>
    </linearGradient>
    <linearGradient id="outfit3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg3)"/>
  <rect width="400" height="300" fill="url(#sp3)"/>

  <!-- 床 -->
  <rect x="0" y="240" width="400" height="60" fill="url(#floor3)"/>
  <line x1="0" y1="241" x2="400" y2="241" stroke="#333" stroke-width="1"/>

  <!-- 奥のジム機器（ぼかし） -->
  <rect x="310" y="80" width="60" height="160" rx="4" fill="#252530" filter="url(#softblur)"/>
  <rect x="320" y="90" width="8" height="140" rx="3" fill="#1e1e28" filter="url(#softblur)"/>
  <rect x="355" y="90" width="8" height="140" rx="3" fill="#1e1e28" filter="url(#softblur)"/>
  <rect x="315" y="130" width="58" height="6" rx="2" fill="#2e2e3a" filter="url(#softblur)"/>

  <!-- === トレーナー（左・立ち・指導ポーズ） === -->
  <!-- 脚 -->
  <rect x="88" y="195" width="17" height="50" rx="8" fill="url(#outfit3)"/>
  <rect x="110" y="195" width="17" height="50" rx="8" fill="url(#outfit3)"/>
  <!-- 靴 -->
  <ellipse cx="96" cy="246" rx="12" ry="5" fill="#333"/>
  <ellipse cx="118" cy="246" rx="12" ry="5" fill="#333"/>
  <!-- 胴体 -->
  <rect x="83" y="130" width="52" height="68" rx="10" fill="url(#outfit3)"/>
  <!-- 首 -->
  <rect x="103" y="112" width="14" height="22" rx="7" fill="url(#skin3)"/>
  <!-- 頭 -->
  <ellipse cx="110" cy="102" rx="18" ry="20" fill="url(#skin3)"/>
  <!-- 短髪 -->
  <ellipse cx="110" cy="88" rx="18" ry="14" fill="#1a1008"/>
  <!-- 右腕（前方に伸ばして指差し） -->
  <path d="M133 148 Q155 145 168 140" stroke="url(#skin3)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- 指差し手 -->
  <ellipse cx="172" cy="139" rx="8" ry="6" fill="url(#skin3)"/>

  <!-- === クライアント（右・ランジポーズ） === -->
  <!-- 後脚 -->
  <path d="M260 240 Q270 210 265 185" stroke="url(#outfit3)" stroke-width="15" fill="none" stroke-linecap="round"/>
  <!-- 後膝（床に近い） -->
  <ellipse cx="260" cy="242" rx="10" ry="6" fill="#222"/>
  <!-- 前脚（曲げ90度） -->
  <path d="M235 185 Q230 210 240 240" stroke="url(#outfit3)" stroke-width="15" fill="none" stroke-linecap="round"/>
  <!-- 前靴 -->
  <ellipse cx="241" cy="241" rx="14" ry="5" fill="#333"/>
  <!-- 胴体 -->
  <path d="M228 120 Q248 115 260 118 L262 185 Q248 190 232 186 Z" fill="url(#outfit3)"/>
  <!-- 首 -->
  <rect x="241" y="102" width="14" height="22" rx="7" fill="url(#skin3)"/>
  <!-- 頭 -->
  <ellipse cx="248" cy="92" rx="17" ry="19" fill="url(#skin3)"/>
  <!-- 髪 -->
  <ellipse cx="248" cy="78" rx="17" ry="14" fill="#3a2010"/>
  <!-- ドレッドヘア っぽく -->
  <path d="M238 72 Q232 60 228 52" stroke="#3a2010" stroke-width="5" stroke-linecap="round"/>
  <path d="M248 70 Q246 57 244 48" stroke="#3a2010" stroke-width="5" stroke-linecap="round"/>
  <path d="M258 73 Q262 60 265 52" stroke="#3a2010" stroke-width="5" stroke-linecap="round"/>
  <!-- 腕（前に出してバランス） -->
  <path d="M230 140 Q215 135 205 128" stroke="url(#skin3)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M258 140 Q272 132 278 125" stroke="url(#skin3)" stroke-width="11" fill="none" stroke-linecap="round"/>

  <!-- 床の影 -->
  <ellipse cx="110" cy="246" rx="30" ry="4" fill="#000" opacity="0.35" filter="url(#softblur)"/>
  <ellipse cx="248" cy="246" rx="35" ry="4" fill="#000" opacity="0.35" filter="url(#softblur)"/>

  <!-- ピンクアクセント -->
  <line x1="0" y1="296" x2="400" y2="296" stroke="#FF1E8E" stroke-width="4" opacity="0.5"/>

  <!-- テキスト -->
  <text x="20" y="232" font-family="sans-serif" font-size="11" fill="#ffffff" opacity="0.35" letter-spacing="3">PERSONAL TRAINING</text>
</svg>
